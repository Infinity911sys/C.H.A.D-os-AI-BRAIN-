apiVersion: apps/v1
kind: Deployment
metadata:
  name: chad-os-phase1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chad-os-phase1
  template:
    metadata:
      labels:
        app: chad-os-phase1
    spec:
      containers:
        - name: api
          image: chad-os:latest
          ports:
            - containerPort: 8080
          env:
            - name: CONTROL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: chad-os-secrets
                  key: control-token
            - name: ALIGNMENT_THRESHOLD
              value: '0.95'
            - name: AUTONOMY_LEVEL
              value: 'A2'
